[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leansatp"
version = "0.1.0"
description = "Standalone LeanSATP runtime for Lean-side SATP inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub",
    "numpy",
    "torch>=2.0.0",
    "tqdm",
    "transformers>=4.0.0",
]

[tool.setuptools.package-dir]
"" = "python/src"

[tool.setuptools.packages.find]
where = ["python/src"]
