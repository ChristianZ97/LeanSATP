[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leansatp"
version = "0.1.0"
description = "Standalone LeanSATP runtime for Lean-side SATP inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub",
    "numpy",
    "rich>=13.0.0",
    "torch==2.5.1",
    "tqdm",
    "transformers>=4.0.0",
]

[tool.setuptools.package-dir]
"" = "python/src"

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
